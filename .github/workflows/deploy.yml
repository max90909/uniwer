# Автоматическая сборка ОТКЛЮЧЕНА: сайт публикуется вручную.
#
# Порядок сейчас такой — вы собираете сайт локально (`npm run build:site`),
# коммитите папку `docs/` и пушите; GitHub Pages настроен отдавать эту папку.
# Так сайт обновляется ровно тогда, когда вы этого захотели.
#
# Этот workflow оставлен как запасной вариант и сам по себе не запускается —
# только вручную, кнопкой «Run workflow». Учтите: он работает лишь если в
# Settings → Pages источником выбран «GitHub Actions». При источнике
# «Deploy from a branch» (папка /docs) запуск завершится ошибкой — это
# ожидаемо, просто не запускайте его.
name: Deploy demo to GitHub Pages (вручную)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run build -- --base=/${{ github.event.repository.name }}/

      # Pages не умеет перезаписывать пути, поэтому прямой заход на /login
      # вернул бы 404. Копия index.html под именем 404.html отдаёт то же
      # приложение, а react-router разбирает адрес на клиенте.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
